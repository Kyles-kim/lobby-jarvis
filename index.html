<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Lobby</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#0E1116; --bg2:#12161D; --surface:#171B22; --raised:#1F2530; --line:#2A313D;
  --ink:#EDEFF3; --muted:#8A93A3; --faint:#5C6474;
  --brass:#D4A55A; --brass-deep:#A87C38; --brass-soft:rgba(212,165,90,.14);
  --blue:#7FB0E8; --blue-soft:rgba(127,176,232,.14);
  --ok:#5DBB8A; --danger:#E0675C; --danger-soft:rgba(224,103,92,.14);
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
[hidden]{display:none!important}

/* ── 레이아웃 ── */
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;max-width:560px;margin:0 auto}
.top{padding:calc(14px + var(--sat)) 18px 10px;display:flex;align-items:center;gap:12px;background:linear-gradient(var(--bg),rgba(14,17,22,.92))}
.mark{display:flex;align-items:baseline;gap:8px}
.mark{gap:12px}
.mark b{font-size:44px;line-height:1.05;letter-spacing:-.01em;font-weight:700;
  background:linear-gradient(100deg,#FF5A4E 0%,#FF9B3D 22%,#FFD66B 42%,#7FE3FF 64%,#6C8CFF 82%,#C27BFF 100%);
  background-size:135% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px rgba(255,155,61,.28)) drop-shadow(0 0 18px rgba(127,227,255,.18));
  animation:logoFlow 9s ease-in-out infinite alternate}
.mark b i{font-style:normal}
@keyframes logoFlow{from{background-position:0% 50%}to{background-position:100% 50%}}
@media (prefers-reduced-motion:reduce){.mark b{animation:none}}
.mark span{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.06em}
.top .sp{flex:1}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.8}
main{overflow-y:auto;padding:4px 18px 24px;-webkit-overflow-scrolling:touch}
.view{display:grid;gap:16px;align-content:start}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--bg2);padding:6px 8px calc(6px + var(--sab))}
.tab{background:none;border:0;display:grid;justify-items:center;gap:2px;padding:6px 0;color:var(--faint);font-size:12px;border-radius:10px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab[aria-selected="true"]{color:var(--brass)}
.tab[aria-selected="true"] svg{filter:drop-shadow(0 0 6px rgba(212,165,90,.35))}

/* ── 마이크 ── */
.stage{display:grid;justify-items:center;gap:12px;padding:18px 0 6px}
.greet{font-size:13px;color:var(--muted);text-align:center}
.greet b{color:var(--ink);font-weight:500}
.mic{position:relative;width:128px;height:128px;border-radius:50%;border:0;background:radial-gradient(circle at 50% 40%,#2A2F39,#171B22 70%);box-shadow:0 0 0 1px var(--line),0 0 0 10px rgba(212,165,90,.05),0 10px 30px rgba(0,0,0,.45);display:grid;place-items:center;transition:transform .15s}
.mic{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.mic:active{transform:scale(.97)}
.mic::before{content:"";position:absolute;inset:6px;border-radius:50%;border:2px solid var(--brass);opacity:.8}
.mic svg{width:40px;height:40px;stroke:var(--brass);fill:none;stroke-width:1.8}
.mic.small{width:84px;height:84px}
.mic.small svg{width:28px;height:28px}
.mic.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--brass);animation:ring 1.4s ease-out infinite}
.mic.on{background:radial-gradient(circle at 50% 40%,#3A3222,#1E1A12 70%)}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(1.35);opacity:0}}
@media (prefers-reduced-motion:reduce){.mic.on::after{animation:none;opacity:.6}}
.mic-hint{font-size:12.5px;color:var(--muted);min-height:20px;text-align:center}
.live{min-height:48px;text-align:center;font-size:16px;color:var(--ink);padding:0 8px}
.live.dim{color:var(--faint)}

.typebox{min-width:0;display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 14px}
.typebox textarea{flex:1;min-width:0;width:100%;background:none;border:0;resize:none;outline:none;min-height:24px;max-height:120px;padding:4px 0;line-height:1.5}
.typebox textarea::placeholder{color:var(--faint)}
.send{height:36px;padding:0 14px;border-radius:10px;border:0;background:var(--brass);color:#1A1408;font-weight:700;font-size:14px}
.send:disabled{opacity:.4}

/* ── 공통 카드 ── */
.sec-title{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;font-family:var(--mono);margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:10px}
.card.accent{border-color:rgba(212,165,90,.55);box-shadow:0 0 0 3px var(--brass-soft)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;font-size:12px;border:1px solid var(--line);color:var(--muted);background:var(--bg2);white-space:nowrap}
.chip.t{color:var(--brass);border-color:rgba(212,165,90,.4);background:var(--brass-soft)}
.chip.c{color:var(--blue);border-color:rgba(127,176,232,.35);background:var(--blue-soft)}
.chip.new{color:#1A1408;background:var(--brass);border-color:var(--brass);font-weight:500}
.chip.st-예정{color:var(--blue)} .chip.st-완료{color:var(--ok)} .chip.st-취소{color:var(--faint);text-decoration:line-through}
.date{font-family:var(--mono);font-size:12px;color:var(--muted)}
.ttl{font-weight:500;flex:1 1 auto;min-width:0}
.amt{font-family:var(--mono);font-size:13px;color:var(--ink);margin-left:auto;font-variant-numeric:tabular-nums}
.body{color:var(--muted);font-size:13.5px;white-space:pre-wrap}
.warn{font-size:13px;color:var(--brass);background:var(--brass-soft);border-radius:8px;padding:6px 10px}

/* ── 폼 ── */
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .wide{grid-column:1/-1}
.fld{display:grid;gap:3px}
.fld>span{font-size:11.5px;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;outline:none;font-size:14px}
.fld textarea{resize:vertical;min-height:60px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--brass)}
.fld input[readonly]{color:var(--faint)}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px}
.check input{accent-color:var(--brass);width:18px;height:18px}

.btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn{height:40px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--raised);font-size:14px;font-weight:500}
.btn.pri{background:var(--brass);border-color:var(--brass);color:#1A1408;font-weight:700}
.btn.del{color:var(--danger);border-color:rgba(224,103,92,.45);background:var(--danger-soft)}
.btn.ghost{background:none}
.btn:disabled{opacity:.45}
.confirm{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;background:var(--danger-soft);border-radius:10px;padding:8px 10px;font-size:13.5px}
.confirm span{margin-right:auto}

/* ── 묻기 ── */
.thread{display:grid;gap:14px}
.q-bub{justify-self:end;max-width:85%;background:var(--raised);border-radius:14px 14px 4px 14px;padding:9px 13px}
.a-bub{background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:12px 14px;display:grid;gap:10px}
.a-head{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;color:var(--brass);letter-spacing:.06em}
.a-head .sp{flex:1}
.speak{font-size:16px;line-height:1.65}
.detail{font-size:13.5px;color:var(--muted);white-space:pre-wrap;border-top:1px dashed var(--line);padding-top:10px}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--muted)}
.stat b{color:var(--ink);font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.evi{display:grid;gap:6px}
.evi summary{font-size:12.5px;color:var(--blue);cursor:pointer;list-style:none}
.evi summary::-webkit-details-marker{display:none}
.mini{display:flex;gap:8px;align-items:baseline;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.mini:last-child{border-bottom:0}
.mini .ttl{font-weight:400}
.suggest{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.suggest button{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:5px 12px;font-size:13px;color:var(--muted)}

/* ── 수정&삭제 ── */
.filters{display:grid;gap:8px;position:sticky;top:0;background:var(--bg);padding:6px 0 10px;z-index:2}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:0 0 auto;height:32px;padding:0 13px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#1A1408;font-weight:700}
.frow{display:grid;grid-template-columns:auto 1fr;gap:8px}
.frow select,.frow input,.range input{background:var(--surface);border:1px solid var(--line);border-radius:10px;height:38px;padding:0 10px;outline:none;min-width:0}
.range{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;color:var(--muted)}
.count{font-size:12.5px;color:var(--muted)}
.rec{cursor:pointer}
.rec .head{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.rec[aria-expanded="true"]{border-color:var(--brass)}
.foot-link{background:none;border:0;color:var(--blue);font-size:13px;padding:10px;justify-self:center}
.empty{text-align:center;color:var(--faint);font-size:13.5px;padding:28px 0}

/* ── 설정 · 토스트 · 로딩 ── */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;align-items:end;z-index:20}
.sheet{background:var(--surface);border-radius:18px 18px 0 0;padding:18px 18px calc(18px + var(--sab));display:grid;gap:14px;max-width:560px;width:100%;margin:0 auto;border-top:1px solid var(--line)}
.sheet h2{margin:0;font-size:18px}
.sheet p{margin:0;font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--sab));transform:translateX(-50%);background:var(--raised);border:1px solid var(--line);padding:9px 16px;border-radius:20px;font-size:13.5px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:90vw}
.toast.err{border-color:var(--danger);color:#F3B2AB}
.busy{display:flex;gap:10px;align-items:center;justify-content:center;color:var(--muted);font-size:13.5px;padding:10px}
.dots{display:inline-flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--brass);animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
.demo-badge{font-family:var(--mono);font-size:10.5px;color:#1A1408;background:var(--brass);border-radius:4px;padding:1px 6px}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="mark"><b>Lobb<i>y</i></b><span id="today">—</span></div>
    <span class="demo-badge" id="demoBadge" hidden>DEMO</span>
    <div class="sp"></div>
    <button class="icon-btn" id="btnSettings" aria-label="설정">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <main id="main">
    <!-- ───── 말하기 ───── -->
    <section class="view" id="v-log">
      <div class="stage">
        <div class="greet">카일님, <b>무엇을 기록할까요?</b></div>
        <button class="mic" id="micLog" aria-label="말하기 시작">
          <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <div class="mic-hint" id="hintLog">버튼을 누른 채로 말씀하세요</div>
        <div class="live dim" id="liveLog">예) 어제 엔진오일 갈았어 8만 5천 원</div>
      </div>
      <div class="typebox">
        <textarea id="txtLog" rows="1" placeholder="또는 직접 입력"></textarea>
        <button class="send" id="sendLog">정리</button>
      </div>
      <div id="busyLog" class="busy" hidden><span class="dots"><i></i><i></i><i></i></span>Lobby가 정리하고 있습니다</div>
      <div id="confirmArea" class="view"></div>
      <div class="sec-title"><span>최근 기록</span></div>
      <div id="recentList" class="view"></div>
    </section>

    <!-- ───── 묻기 ───── -->
    <section class="view" id="v-ask" hidden>
      <div class="stage">
        <button class="mic small" id="micAsk" aria-label="질문하기 시작">
          <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <div class="mic-hint" id="hintAsk">누른 채로 궁금한 것을 물어보세요</div>
        <div class="live dim" id="liveAsk"></div>
      </div>
      <div class="suggest" id="suggest">
        <button>이번 주 일정 알려 줘</button>
        <button>이번 달 지출 합계는?</button>
        <button>엔진오일 언제 갈았지?</button>
        <button>최근 아이디어 뭐 있었지?</button>
      </div>
      <div class="typebox">
        <textarea id="txtAsk" rows="1" placeholder="질문을 입력"></textarea>
        <button class="send" id="sendAsk">묻기</button>
      </div>
      <div id="thread" class="thread"></div>
    </section>

    <!-- ───── 수정&삭제 ───── -->
    <section class="view" id="v-edit" hidden>
      <div class="filters">
        <div class="seg" id="seg">
          <button data-p="today">오늘</button>
          <button data-p="week" aria-pressed="true">최근 7일</button>
          <button data-p="month">이번 달</button>
          <button data-p="all">전체</button>
          <button data-p="custom">직접 선택</button>
        </div>
        <div class="range" id="range" hidden>
          <input type="date" id="fFrom" aria-label="시작일"><span>~</span><input type="date" id="fTo" aria-label="종료일">
        </div>
        <div class="frow">
          <select id="fType" aria-label="유형"><option value="">전체 유형</option></select>
          <input id="fQ" type="search" placeholder="검색어 (제목·내용·인물·장소)" aria-label="검색어">
        </div>
        <div class="count" id="editCount"></div>
      </div>
      <div id="editList" class="view"></div>
      <button class="foot-link" id="btnDeleted">삭제된 기록 보기</button>
    </section>
  </main>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-v="log" aria-selected="true">
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>말하기</button>
    <button class="tab" role="tab" data-v="ask" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.3 2.4c-.5.2-.8.6-.8 1.1v.5M12 16h.01"/></svg>묻기</button>
    <button class="tab" role="tab" data-v="edit" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>수정&amp;삭제</button>
  </nav>
</div>

<!-- 설정 -->
<div class="sheet-bg" id="settings" hidden>
  <div class="sheet" role="dialog" aria-label="설정">
    <h2>설정</h2>
    <p>Apps Script 웹 앱 주소와 접속 암호를 입력하세요. 이 기기에만 저장됩니다.</p>
    <label class="fld"><span>웹 앱 주소 (https://script.google.com/macros/s/…/exec)</span><input id="sUrl" type="url" autocomplete="off"></label>
    <label class="fld"><span>접속 암호 (APP_PIN)</span><input id="sPin" type="password" inputmode="numeric" autocomplete="off"></label>
    <label class="fld"><span>읽어 주는 속도</span>
      <select id="sRate"><option value="0.9">조금 느리게</option><option value="1" selected>보통</option><option value="1.15">조금 빠르게</option><option value="1.3">빠르게</option></select></label>
    <label class="check"><input type="checkbox" id="sAuto" checked>말이 끝나면 자동으로 정리·질문</label>
    <label class="check"><input type="checkbox" id="sSpeak" checked>답변을 음성으로 읽기</label>
    <div class="btns">
      <button class="btn ghost" id="sDemo">데모로 둘러보기</button>
      <button class="btn" id="sTest">연결 테스트</button>
      <button class="btn pri" id="sSave">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
'use strict';
/* ═════════════ 상태 · 설정 ═════════════ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => (n === null || n === undefined || n === '') ? '' : Number(n).toLocaleString('ko-KR') + '원';
const store = {

};

/* ═════════════ 서버 호출 ═════════════ */
async function api(action, data = {}) {
  if (isDemo()) return Demo.handle(action, data);
  if (!S.url) { openSettings(); throw new Error('설정에서 웹 앱 주소를 먼저 입력해 주세요.'); }
  let res, txt;
  try {
    res = await fetch(S.url, { method: 'POST', redirect: 'follow', body: JSON.stringify({ ...data, action, pin: S.pin }) });
    txt = await res.text();
  } catch (e) {
    throw new Error('Lobby 서버에 연결하지 못했습니다. 설정 → [연결 테스트]로 확인해 주세요.');
  }
  let j;
  try { j = JSON.parse(txt); }
  catch { throw new Error('서버가 Lobby 응답 대신 다른 페이지를 보냈습니다. Apps Script 배포 설정(액세스: 모든 사용자)을 확인해 주세요.'); }
  if (!j.ok) throw new Error(j.error || '서버 오류');
  return j;
}

/* ═════════════ 음성 인식 · 읽기 ═════════════ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recTarget = null;
/* 누르는 동안만 듣기(푸시투토크)
   - 안드로이드 크롬은 continuous 모드에서 같은 문장을 누적해 되풀이 전달하는 문제가 있어,
     짧은 인식 세션을 손가락을 떼기 전까지 이어 붙이는 방식으로 처리합니다. */
function mergeText(base, add) {
  base = (base || '').trim(); add = (add || '').trim();
  if (!add) return base;
  if (!base) return add;
  const b = base.replace(/\s+/g, ''), a = add.replace(/\s+/g, '');
  if (a.startsWith(b)) return add;          // 새 결과가 이전 것을 포함 → 교체
  if (b.endsWith(a) || b.includes(a)) return base; // 이미 들어간 말 → 무시
  const bw = base.split(/\s+/), aw = add.split(/\s+/);  // 끝-앞이 겹치면 겹친 부분 한 번만
  for (let k = Math.min(bw.length, aw.length); k > 0; k--) {
    if (bw.slice(-k).join(' ') === aw.slice(0, k).join(' ')) return bw.concat(aw.slice(k)).join(' ');
  }
  return base + ' ' + add;
}
function sessionText(results) {
  let t = '';
  for (let i = 0; i < results.length; i++) t = mergeText(t, results[i][0].transcript);
  return t;
}
const PTT = { holding: false, committed: '', sess: '', target: null, busy: false };
function pttStart(target) {
  if (!SR) { toast('이 브라우저는 음성 인식을 지원하지 않습니다. 직접 입력해 주세요.', true); return; }
  if (PTT.holding) return;
  stopSpeaking();
  if (rec) { try { rec.abort(); } catch {} rec = null; }
  Object.assign(PTT, { holding: true, committed: '', sess: '', target });
  const mic = $(target === 'log' ? '#micLog' : '#micAsk');
  const live = $(target === 'log' ? '#liveLog' : '#liveAsk');
  const hint = $(target === 'log' ? '#hintLog' : '#hintAsk');
  mic.classList.add('on');
  hint.textContent = '듣고 있습니다… 손을 떼면 끝';
  live.classList.remove('dim'); live.textContent = '';
  if (navigator.vibrate) navigator.vibrate(15);
  pttSession();
}
function pttSession() {
  const target = PTT.target;
  const live = $(target === 'log' ? '#liveLog' : '#liveAsk');
  const r = new SR(); rec = r;
  r.lang = 'ko-KR'; r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
  PTT.sess = '';
  r.onresult = e => {
    PTT.sess = sessionText(e.results);
    live.textContent = mergeText(PTT.committed, PTT.sess);
  };
  r.onerror = e => {
    if (!['no-speech', 'aborted', 'network'].includes(e.error)) toast('음성 인식 오류: ' + e.error, true);
    if (e.error === 'not-allowed') PTT.holding = false;
  };
  r.onend = () => {
    PTT.committed = mergeText(PTT.committed, PTT.sess); PTT.sess = '';
    if (rec === r) rec = null;
    if (PTT.holding) { try { pttSession(); } catch { PTT.holding = false; pttFinish(); } }  // 아직 누르고 있으면 계속 듣기
    else pttFinish();
  };
  try { r.start(); } catch { PTT.holding = false; pttFinish(); }
}
function pttStop() {
  if (!PTT.holding) return;
  PTT.holding = false;
  if (navigator.vibrate) navigator.vibrate(10);
  if (rec) { try { rec.stop(); } catch { pttFinish(); } } else pttFinish();
}
function pttFinish() {
  const target = PTT.target; if (!target) return;
  const mic = $(target === 'log' ? '#micLog' : '#micAsk');
  const live = $(target === 'log' ? '#liveLog' : '#liveAsk');
  const hint = $(target === 'log' ? '#hintLog' : '#hintAsk');
  const txt = $(target === 'log' ? '#txtLog' : '#txtAsk');
  mic.classList.remove('on');
  hint.textContent = target === 'log' ? '버튼을 누른 채로 말씀하세요' : '누른 채로 궁금한 것을 물어보세요';
  const t = PTT.committed.trim();
  PTT.target = null; PTT.committed = '';
  if (!t) { live.classList.add('dim'); live.textContent = target === 'log' ? '예) 어제 엔진오일 갈았어 8만 5천 원' : ''; return; }
  live.textContent = t;
  txt.value = t; autoGrow(txt);
  if (S.auto) (target === 'log' ? doParse() : doAsk());
}
function bindPTT(sel, target) {
  const b = $(sel);
  b.addEventListener('pointerdown', e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch {} pttStart(target); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => b.addEventListener(ev, pttStop));
  b.addEventListener('contextmenu', e => e.preventDefault());
  b.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); pttStart(target); } });
  b.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') pttStop(); });
}
function say(text) {
  if (!S.speak || !('speechSynthesis' in window) || !text) return;
  stopSpeaking();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ko-KR'; u.rate = Number(S.rate) || 1;
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('ko'));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
function stopSpeaking() { if ('speechSynthesis' in window) speechSynthesis.cancel(); }

/* ═════════════ 공통 렌더 조각 ═════════════ */
function chipsHTML(r) {
  const st = r.상태 && r.상태 !== '정상' ? `<span class="chip st-${esc(r.상태)}">${esc(r.상태)}</span>` : '';
  return `<span class="chip t">${esc(r.유형)}</span><span class="chip c">${esc(r.분류)}</span>${st}`;
}
function shortDate(d) { return d ? d.slice(5) : ''; }
function optionList(list, cur) { return list.map(v => `<option${v === cur ? ' selected' : ''}>${esc(v)}</option>`).join(''); }
function catOptions(cur) {
  const names = S.categories.map(c => c.name);
  if (cur && !names.includes(cur)) names.push(cur);
  return optionList(names, cur);
}
function renderRecent(rows) {
  const box = $('#recentList');
  if (!rows || !rows.length) { box.innerHTML = '<div class="empty">아직 기록이 없습니다. 첫 기록을 말씀해 보세요.</div>'; return; }

    <div class="ttl">${esc(r.제목)}</div></div>`).join('');
}

/* ═════════════ 말하기: 정리 → 확인 → 저장 ═════════════ */
async function doParse() {
  const text = $('#txtLog').value.trim();
  if (!text) return;
  $('#busyLog').hidden = false; $('#sendLog').disabled = true; $('#confirmArea').innerHTML = '';
  try {
    const r = await api('parse', { text });
    S.pending = { raw: r.raw, items: r.items };
    renderConfirm();
    const n = r.items.length;
    const first = r.items[0];
    say(n > 1 ? `${n}건으로 정리했습니다. 확인 후 저장해 주세요.` : `${first.유형}, ${first.제목}. 저장할까요?`);
  } catch (e) { toast(e.message, true); }
  finally { $('#busyLog').hidden = true; $('#sendLog').disabled = false; }
}

        <label class="fld"><span>유형</span><select data-k="유형">${optionList(S.types, it.유형)}</select></label>
        <label class="fld"><span>분류</span><select data-k="분류">${catOptions(it.분류)}</select></label>

      </div>

    </div>`).join('') +
    `<div class="btns"><button class="btn" id="cCancel">취소</button><button class="btn pri" id="cSave">저장</button></div>`;
}

function collectConfirm() {
  document.querySelectorAll('#confirmArea .card[data-i]').forEach(card => {
    const it = S.pending.items[Number(card.dataset.i)];
    card.querySelectorAll('[data-k]').forEach(el => {
      const k = el.dataset.k;
      it[k] = el.type === 'checkbox' ? el.checked : el.value;
    });
    it.금액 = it.금액 === '' ? null : Number(String(it.금액).replace(/[^\d]/g, '')) || null;
  });
}

async function doSave() {
  collectConfirm();
  const btn = $('#cSave'); btn.disabled = true;
  try {
    const r = await api('save', { items: S.pending.items, raw: S.pending.raw });
    const n = r.ids.length;
    S.pending = null; renderConfirm();
    $('#txtLog').value = ''; $('#liveLog').textContent = '예) 어제 엔진오일 갈았어 8만 5천 원'; $('#liveLog').classList.add('dim');
    renderRecent(r.recent);
    toast(`저장했습니다 (${n}건)`);
    say('저장했습니다.');
    refreshCategories();
  } catch (e) { toast(e.message, true); btn.disabled = false; }
}

/* ═════════════ 묻기 ═════════════ */
async function doAsk(qText) {
  const q = (qText || $('#txtAsk').value).trim();
  if (!q) return;
  $('#txtAsk').value = ''; autoGrow($('#txtAsk'));
  $('#suggest').hidden = true;
  const th = $('#thread');
  const wrap = document.createElement('div');
  wrap.className = 'thread';
  wrap.innerHTML = `<div class="q-bub">${esc(q)}</div><div class="busy"><span class="dots"><i></i><i></i><i></i></span>기록을 찾고 있습니다</div>`;
  th.prepend(wrap);
  try {
    const r = await api('ask', { question: q });
    wrap.querySelector('.busy').outerHTML = answerHTML(r);
    wrap.querySelector('[data-replay]')?.addEventListener('click', () => say(r.speech));
    say(r.speech);
  } catch (e) {
    wrap.querySelector('.busy').outerHTML = `<div class="a-bub"><div class="speak">${esc(e.message)}</div></div>`;
  }
}
function answerHTML(r) {
  const s = r.stats || {};
  const stats = [];
  if (s.건수 != null) stats.push(`<span class="stat">해당 <b>${s.건수}</b>건</span>`);
  if (s.금액건수) stats.push(`<span class="stat">합계 <b>${won(s.합계)}</b></span>`, `<span class="stat">평균 <b>${won(s.평균)}</b></span>`);
  if (s.기간 && (s.기간.시작 || s.기간.끝)) stats.push(`<span class="stat">${esc(s.기간.시작)} ~ ${esc(s.기간.끝)}</span>`);
  const ev = (r.evidence || []);
  return `<div class="a-bub">
    <div class="a-head">LOBBY<span class="sp"></span><button class="icon-btn" data-replay aria-label="다시 듣기" style="width:30px;height:30px">
      <svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button></div>
    <div class="speak">${esc(r.speech)}</div>
    ${stats.length ? `<div class="stats">${stats.join('')}</div>` : ''}
    ${r.detail ? `<div class="detail">${esc(r.detail)}</div>` : ''}
    ${ev.length ? `<details class="evi"><summary>근거 기록 ${ev.length}건 보기</summary>${ev.map(x => `
      <div class="mini"><span class="date">${esc(shortDate(x.대상일))}</span><span class="ttl">${esc(x.제목)}</span>${x.금액 != null ? `<span class="amt">${won(x.금액)}</span>` : ''}</div>`).join('')}</details>` : ''}
  </div>`;
}

/* ═════════════ 수정&삭제 ═════════════ */
function ymd(d) { const z = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`; }
function periodRange(p) {
  const now = new Date(), t = ymd(now);
  if (p === 'today') return [t, t];
  if (p === 'week') { const d = new Date(now); d.setDate(d.getDate() - 6); return [ymd(d), t]; }
  if (p === 'month') return [t.slice(0, 8) + '01', t.slice(0, 8) + '31'];
  if (p === 'custom') return [$('#fFrom').value, $('#fTo').value];
  return ['', ''];
}
let listTimer;
function loadList() { clearTimeout(listTimer); listTimer = setTimeout(_loadList, 200); }
async function _loadList() {

    S.list = r.rows;
    $('#editCount').textContent = (S.showDeleted ? '삭제된 기록 ' : '') + `${r.total}건` + (r.total > r.rows.length ? ` (최근 ${r.rows.length}건 표시)` : '');
    renderList();
  } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

async function doUpdate(id, btn) {
  const card = document.querySelector(`.rec[data-id="${CSS.escape(id)}"]`);
  const fields = {};
  card.querySelectorAll('[data-k]').forEach(el => fields[el.dataset.k] = el.value);
  btn.disabled = true;
  try {
    const r = await api('update', { id, fields });
    if (!r.changed) { toast('바뀐 내용이 없습니다'); btn.disabled = false; return; }
    const i = S.list.findIndex(x => x.ID === id);
    if (i >= 0 && r.row) S.list[i] = r.row;
    S.openId = null; renderList();
    toast(`수정했습니다 (${r.changed}칸)`);
  } catch (e) { toast(e.message, true); btn.disabled = false; }
}
async function doDelete(id) {
  try {
    await api('delete', { id });
    S.list = S.list.filter(x => x.ID !== id); S.openId = null; S.confirmDel = null;
    renderList(); toast('삭제했습니다');
    $('#editCount').textContent = `${S.list.length}건`;
  } catch (e) { toast(e.message, true); }
}
async function doRestore(id) {
  try {
    const r = await api('restore', { id });
    S.list = S.list.filter(x => x.ID !== id); renderList();
    toast(`복구했습니다 (상태: ${r.상태})`);
  } catch (e) { toast(e.message, true); }
}

/* ═════════════ 탭 · 설정 · 기타 ═════════════ */
function show(v) {
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.v === v)));
  ['log', 'ask', 'edit'].forEach(x => $('#v-' + x).hidden = x !== v);
  $('#main').scrollTop = 0;
  if (v === 'edit') loadList();
  try { history.replaceState(null, '', '#' + v); } catch {}
}
function openSettings() {
  $('#sUrl').value = S.url === 'demo' ? '' : S.url; $('#sPin').value = S.pin;
  $('#sRate').value = String(S.rate); $('#sAuto').checked = S.auto; $('#sSpeak').checked = S.speak;
  $('#settings').hidden = false;
}
function saveSettings(demo) {
  S.url = demo ? 'demo' : $('#sUrl').value.trim();
  S.pin = $('#sPin').value.trim(); S.rate = Number($('#sRate').value);
  S.auto = $('#sAuto').checked; S.speak = $('#sSpeak').checked;
  ['url', 'pin', 'rate', 'auto', 'speak'].forEach(k => store.set(k, S[k]));
  $('#settings').hidden = true;
  boot();
}
let toastT;
function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, err ? 4200 : 2200);
}
function autoGrow(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }
async function refreshCategories() {
  try { const r = await api('init'); S.categories = r.categories; } catch {}
}
async function boot() {
  $('#demoBadge').hidden = !isDemo();
  const d = new Date(), wd = '일월화수목금토'[d.getDay()];
  $('#today').textContent = `${d.getMonth() + 1}.${d.getDate()} ${wd}`;
  if (!S.url || (!isDemo() && !S.pin)) { renderRecent([]); openSettings(); return; }
  try {
    const r = await api('init');
    S.categories = r.categories; if (r.types) S.types = r.types;
    if (r.states) S.states = r.states.filter(s => s !== '삭제');
    $('#fType').innerHTML = '<option value="">전체 유형</option>' + optionList(S.types, '');
    renderRecent(r.recent);
  } catch (e) { toast(e.message, true); }
}

/* ═════════════ 이벤트 연결 ═════════════ */
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => show(t.dataset.v)));
bindPTT('#micLog', 'log');
bindPTT('#micAsk', 'ask');
document.addEventListener('visibilitychange', () => { if (document.hidden) pttStop(); });
$('#sendLog').addEventListener('click', doParse);
$('#sendAsk').addEventListener('click', () => doAsk());
['#txtLog', '#txtAsk'].forEach(sel => {
  const el = $(sel);
  el.addEventListener('input', () => autoGrow(el));
  el.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sel === '#txtLog' ? doParse() : doAsk(); } });
});
$('#suggest').addEventListener('click', e => { if (e.target.tagName === 'BUTTON') doAsk(e.target.textContent); });
$('#confirmArea').addEventListener('click', e => {
  if (e.target.id === 'cSave') doSave();
  else if (e.target.id === 'cCancel') { S.pending = null; renderConfirm(); toast('저장하지 않았습니다'); }
  else if (e.target.dataset.drop != null) { collectConfirm(); S.pending.items.splice(Number(e.target.dataset.drop), 1); renderConfirm(); }
});
$('#seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.editPeriod = b.dataset.p;
  document.querySelectorAll('#seg button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  $('#range').hidden = S.editPeriod !== 'custom';
  if (S.editPeriod === 'custom' && !$('#fFrom').value) { const [f, t] = periodRange('week'); $('#fFrom').value = f; $('#fTo').value = t; }
  loadList();
});
['#fFrom', '#fTo', '#fType'].forEach(s => $(s).addEventListener('change', loadList));
$('#fQ').addEventListener('input', loadList);
$('#btnDeleted').addEventListener('click', () => {
  S.showDeleted = !S.showDeleted; S.openId = null;
  $('#btnDeleted').textContent = S.showDeleted ? '← 기록 목록으로' : '삭제된 기록 보기';
  loadList();
});
$('#editList').addEventListener('click', e => {
  const t = e.target;
  if (t.closest('input,select,textarea')) return;
  if (t.dataset.update) return doUpdate(t.dataset.update, t);
  if (t.dataset.askDel) { S.confirmDel = t.dataset.askDel; return renderList(); }
  if (t.dataset.cancelDel != null) { S.confirmDel = null; return renderList(); }
  if (t.dataset.doDel) return doDelete(t.dataset.doDel);
  if (t.dataset.restore) return doRestore(t.dataset.restore);
  const o = t.closest('[data-open]');
  if (o) { S.openId = S.openId === o.dataset.open ? null : o.dataset.open; S.confirmDel = null; renderList(); }
});
$('#editList').addEventListener('keydown', e => {
  const o = e.target.closest('.rec[data-open]');
  if (o && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); S.openId = o.dataset.open; renderList(); }
});
$('#btnSettings').addEventListener('click', openSettings);
$('#sSave').addEventListener('click', () => saveSettings(false));
$('#sDemo').addEventListener('click', () => saveSettings(true));
$('#sTest').addEventListener('click', async () => {
  const url = $('#sUrl').value.trim(), pin = $('#sPin').value.trim();
  if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)) return toast('주소는 https://script.google.com/macros/s/…/exec 형식이어야 합니다', true);
  const b = $('#sTest'); b.disabled = true; b.textContent = '확인 중…';
  try {
    const g = await fetch(url, { redirect: 'follow' }).then(r => r.json());
    if (!g.ok) throw 0;
    const r = await fetch(url, { method: 'POST', body: JSON.stringify({ action: 'init', pin }) }).then(r => r.json());
    toast(r.ok ? '연결 성공! 저장을 눌러 주세요.' : '서버 연결은 됐지만: ' + r.error, !r.ok);
  } catch {
    toast('서버에 닿지 못했습니다. 배포(액세스: 모든 사용자)와 주소를 확인해 주세요.', true);
  } finally { b.disabled = false; b.textContent = '연결 테스트'; }
});
$('#settings').addEventListener('click', e => { if (e.target.id === 'settings' && S.url) $('#settings').hidden = true; });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

/* ═════════════ 데모 모드 (서버 없이 화면 둘러보기) ═════════════ */
const Demo = (() => {
  const t = ymd(new Date());
  const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };
  const cats = ['차량','생활','미용/자기관리','외식/모임','가족행사','여가/취미','여행','업무','재테크','앱개발'].map(n => ({ name: n, desc: '' }));
  let seq = 10;
  let rows = [
    { ID: 'D-001', 입력일시: addDays(-1) + ' 08:12', 대상일: addDays(-1), 대상시각: '', 유형: '지출', 분류: '차량', 제목: '엔진오일 교체', 내용: '주행거리 62,000km 시점 교체', 금액: 85000, 인물: '', 장소: '', 태그: '엔진오일, 정비', 상태: '정상', 원문: '어제 엔진오일 갈았어 8만5천원 주행거리 6만2천', 수정일시: '', 삭제일시: '' },
    { ID: 'D-002', 입력일시: addDays(-1) + ' 08:12', 대상일: addDays(7), 대상시각: '07:00', 유형: '일정', 분류: '여가/취미', 제목: '안성 골프 라운딩', 내용: '오전 7시 티업', 금액: null, 인물: '', 장소: '안성', 태그: '골프', 상태: '예정', 원문: '다음주 토요일 7시 안성 골프', 수정일시: '', 삭제일시: '' },
    { ID: 'D-003', 입력일시: addDays(-2) + ' 21:40', 대상일: addDays(-2), 대상시각: '', 유형: '아이디어', 분류: '앱개발', 제목: '금형 이력 QR 조회 앱', 내용: '금형 교체 이력을 QR로 찍어서 보는 앱', 금액: null, 인물: '', 장소: '', 태그: '금형, QR', 상태: '정상', 원문: '금형 교체 이력을 QR로 찍어서 보는 앱 만들면 좋겠다', 수정일시: '', 삭제일시: '' },
    { ID: 'D-004', 입력일시: addDays(-3) + ' 19:05', 대상일: addDays(-3), 대상시각: '', 유형: '지출', 분류: '생활', 제목: '이마트 장보기', 내용: '주말 장보기', 금액: 123000, 인물: '지숙', 장소: '이마트', 태그: '장보기', 상태: '정상', 원문: '이마트 장보기 12만 3천 원', 수정일시: '', 삭제일시: '' },
    { ID: 'D-005', 입력일시: addDays(-4) + ' 17:30', 대상일: addDays(-4), 대상시각: '', 유형: '특이점', 분류: '업무', 제목: '사출 3호기 온도 경보', 내용: '오후에 온도 경보 2회', 금액: null, 인물: '', 장소: '공장', 태그: '3호기, 경보', 상태: '정상', 원문: '사출 3호기 오후에 온도 경보 두 번 떴어', 수정일시: '', 삭제일시: '' },
  ];
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const alive = () => rows.filter(r => r.상태 !== '삭제');
  return {
    async handle(action, d) {
      await wait(action === 'list' || action === 'init' ? 150 : 700);
      if (action === 'init') return { categories: cats, types: S.types, states: ['정상','예정','완료','취소','삭제'], today: t, recent: alive().slice(0, 5) };
      if (action === 'parse') {
        const money = (d.text.match(/(\d+)\s*만\s*(\d+)?\s*천?/) || []);
        const amt = money[1] ? Number(money[1]) * 10000 + (Number(money[2] || 0) * 1000) : null;
        return { raw: d.text, items: [{ 유형: amt ? '지출' : '일상', 분류: amt ? '생활' : '생활', 새분류: false, 분류설명: '', 대상일: t, 대상시각: '', 제목: d.text.slice(0, 20), 내용: d.text, 금액: amt, 인물: '', 장소: '', 태그: '', 상태: '정상', 확인필요: '데모 모드입니다. 실제 정리는 Claude가 합니다.' }] };
      }
      if (action === 'save') {
        const now = t + ' ' + new Date().toTimeString().slice(0, 5);
        const ids = d.items.map(it => { const id = 'D-' + String(++seq).padStart(3, '0'); rows.unshift({ ...it, ID: id, 입력일시: now, 원문: d.raw, 수정일시: '', 삭제일시: '', 인물: it.인물 || '', 장소: it.장소 || '', 태그: it.태그 || '' }); return id; });
        return { ids, recent: alive().slice(0, 5) };
      }
      if (action === 'ask') {
        const spend = alive().filter(r => r.유형 === '지출');
        const sum = spend.reduce((s, r) => s + (r.금액 || 0), 0);
        return { speech: `데모 기록 기준으로 지출은 ${spend.length}건, 합계 ${Math.round(sum / 1000) / 10}만 원입니다. 실제 앱에서는 질문에 맞춰 Claude가 답합니다.`,
          detail: spend.map(r => `• ${r.대상일.slice(5)} ${r.제목} ${won(r.금액)}`).join('\n'),
          evidence: spend, stats: { 건수: spend.length, 금액건수: spend.length, 합계: sum, 평균: Math.round(sum / (spend.length || 1)), 기간: { 시작: '', 끝: '' } } };
      }
      if (action === 'list') {
        let r = rows.filter(x => d.deleted ? x.상태 === '삭제' : x.상태 !== '삭제');
        if (d.from || d.to) r = r.filter(x => { const f = d.from || '0', tt = d.to || '9'; const a = x.대상일, b = x.입력일시.slice(0, 10); return (a >= f && a <= tt) || (b >= f && b <= tt); });
        if (d.type) r = r.filter(x => x.유형 === d.type);
        if (d.q) r = r.filter(x => [x.제목, x.내용, x.인물, x.장소, x.태그].join(' ').includes(d.q));
        return { rows: r, total: r.length };
      }
      const row = rows.find(x => x.ID === d.id);
      if (action === 'update') {
        let n = 0;
        Object.entries(d.fields).forEach(([k, v]) => { if (k === '금액') v = v === '' ? null : Number(v); if (String(row[k] ?? '') !== String(v ?? '')) { row[k] = v; n++; } });
        if (n) row.수정일시 = t + ' ' + new Date().toTimeString().slice(0, 5);
        return { changed: n, row };
      }
      if (action === 'delete') { row._prev = row.상태; row.상태 = '삭제'; row.삭제일시 = t; return { deleted: d.id }; }
      if (action === 'restore') { row.상태 = row._prev || '정상'; row.삭제일시 = ''; return { restored: d.id, 상태: row.상태 }; }
      throw new Error('데모에서 지원하지 않는 요청');
    },
  };
})();

const startTab = (location.hash || '').slice(1);
boot();
if (['ask', 'edit'].includes(startTab)) show(startTab);
</script>
